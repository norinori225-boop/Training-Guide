<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d7182a" />
    <title>オフラインです - ODORIKOトレーニング</title>
    <!--
      ネットワークにもキャッシュにも無い画面を開いたときに、
      サービスワーカー（public/sw.js）が代わりに出す静的ページ。
      Next.js を通らないので、見た目はここに直接書いている。
    -->
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, -apple-system, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP',
          sans-serif;
        line-height: 1.7;
      }
      main {
        width: 100%;
        max-width: 420px;
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 32px 20px;
      }
      .mark {
        font-size: 48px;
        line-height: 1;
      }
      h1 {
        margin: 16px 0 0;
        font-size: 20px;
      }
      p {
        margin: 12px 0 0;
        font-size: 14px;
        color: #475569;
      }
      button {
        margin-top: 24px;
        min-height: 44px;
        width: 100%;
        border: none;
        border-radius: 9999px;
        background: #0284c7;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:active {
        background: #0369a1;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="mark" aria-hidden="true">📡</p>
      <h1>オフラインです</h1>
      <p>
        この画面はまだ読み込んだことがないため、電波がないと表示できません。<br />
        電波の届く場所で、もう一度お試しください。
      </p>
      <button type="button" onclick="location.reload()">再読み込み</button>
    </main>
  </body>
</html>
